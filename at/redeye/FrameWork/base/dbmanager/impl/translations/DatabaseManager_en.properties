
Bitte\ kontaktieren\ Sie\ Ihren\ Administrator\ damit\ dieser\ eine\ Aktualisierung\ der\ Datenbank\ durchf\u00FChren\ kann.\ Um\ den\ Vorgang\ zu\ starten,\ mu\u00DF\ sich\ ein\ Benutzer\ mit\ Administratorrechten\ auf\ dieser\ Applikation\ anmelden.\ Dann\ erfolgen\ auch\ noch\ weiter\ Hinweise.\ Sie\ k\u00F6nnen\ das\ Programm\ nun\ auch\ noch\ weiter\ verwenden,\ es\ ist\ aber\ nicht\ mehr\ sichergestellt\ das\ es\ korrekt\ funktioniert.=Your administrator has to upgrade the database. Therefore you must login with administrator security rights. If you've done this an additional warning will tell you further informations. You still can use the appliaction without upgrading the database, but nobody knows if all is working correct.
Eine\ oder\ mehrere\ Tabellen\ in\ der\ Datenbank\ weichen\ von\ jener\ Version,\ die\ im\ Programm\ ben\u00F6tigt\ werden\ ab.=One or more database tables differ in the version required by this application.
Bitte\ \u00F6ffnen\ Sie\ den\ Datenbankverbindungsdialog\ (Programm\=>Datenbankeinstellungen)\ und\ bet\u00E4tigen\ Sie\ den\ Button\ "Einrichten".\ Dadurch\ werden\ die\ notwendigen\ \u00C4nderungen\ an\ der\ Datenbank\ automatisch\ durchgef\u00FChrt.\ Bevor\ Tabellen\ manipuliert\ werden,\ erstellt\ die\ Applikation\ automatisch\ Sicherungen\ der\ zu\ manipulierenden\ Tabellen.\ Zus\u00E4tzlich\ sollten\ Sie\ jedoch\ vorher\ eine\ Sicherung\ der\ gesammten\ Datenbank\ durchf\u00FChren.\ Um\ Datenverlusten\ vorzubeugen\ stellen\ Sie\ bitte\ auch\ sicher,\ dass\ w\u00E4hren\ der\ Migration\ kein\ anderer\ User\ mehr\ auf\ die\ Datenbank\ zugreift=Please open the dabase settings dialog (Application=>Databasesettings) and click on \"configure\". This way the database will be reconfigured automatically. Before manipulation existing tables the application will create backup copies of these tables. Anyway before doing this task, please make a backup of the database of your own. And be sure that nobody is logged on while doing the migration.
Warnung=Warning
